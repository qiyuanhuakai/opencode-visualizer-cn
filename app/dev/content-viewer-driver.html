<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* wss:; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob: data:; media-src 'self' blob:;"
    />
    <title>Content Viewer Driver (dev-only QA)</title>
    <script type="module" src="./content-viewer-driver.ts"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0d1117;
      }
      #app {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px;
      }
      .driver-status {
        font-family: monospace;
        font-size: 12px;
        color: #8b949e;
        padding: 6px 8px;
        margin-bottom: 8px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
      }
      .surface {
        border: 1px solid #30363d;
        border-radius: 6px;
        overflow: hidden;
        background: #0d1117;
        color: #c9d1d9;
        height: 480px;
      }
      .surface-title {
        font-family: monospace;
        font-size: 12px;
        color: #8b949e;
        padding: 4px 8px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
