name: Runtime v0.9.0 Live QA (task 46)

# Live verification of the REAL remote/HPC surfaces for the v0.9.0 unified runtime.
#
#   - Linux isolated runner: brings up a REAL controller + login + two compute nodes,
#     with a real slurmctld, two real slurmd, a real munged and a real sshd, inside
#     REAL network namespaces, and exercises real sshd (host key / jump host /
#     reconnection) and real slurmctld + two real slurmd with a real `srun` in BOTH
#     the TCP and the relay mode.
#   - The packaged Bridge / Electron artifacts produced by task 45 are measured on
#     macOS / Windows by build-electron.yml's `packaged-bridge-qa` job, which sits
#     downstream of the producing `bridge-installers` job IN THE SAME RUN: an
#     artifact download that does not name its producing run finds nothing, because
#     actions/download-artifact only sees the current run's artifacts.
#
# Privileged initialisation, stated explicitly instead of assumed: the lab writes
# /etc/hosts, installs system packages, creates real network namespaces and
# delegates cgroup v2 — all root-only. A `sudo apt-get` in one step does NOT make a
# later step root. The lab therefore runs in the matched isolated environment, a
# `--privileged ubuntu:24.04` container that owns the whole privileged init, runs
# every daemon as its dedicated user (slurm / munge / labuser), and is discarded on
# teardown; a preflight proves the container can really do that work BEFORE any
# lane, so a missing capability is never mistaken for a dependency-install problem.
# Every apt install lands only inside that disposable container. No step ever
# touches a developer or production host. A missing namespace/daemon precondition
# exits non-zero and still uploads a real artifact; a mock is never substituted for
# a graded surface.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modes:
        description: 'Slurm modes to exercise'
        required: false
        default: 'tcp,relay'

permissions:
  contents: read

jobs:
  live-slurm:
    name: Live Slurm (real srun + real daemons, tcp+relay)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The isolated runner IS the test VM, but the runner user is NOT root and a
      # `sudo apt-get` in an earlier step does not confer root on later ones. The
      # lab's real privileged initialisation — /etc/hosts, system packages, real
      # network namespaces, cgroup v2 delegation — therefore happens inside a
      # --privileged ubuntu:24.04 container (the `docker` lab runtime), with every
      # daemon running as its dedicated user inside it. Prove the container can
      # really perform that privileged work BEFORE any lane: a missing capability
      # must fail here, loudly, instead of being mistaken for a dependency problem.
      - name: Verify the isolated runner can host the privileged lab container
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'docker daemon reachable: {{.ServerVersion}}'
          docker run --rm --privileged ubuntu:24.04 ip netns add vislab-preflight
          echo "privileged container created a real network namespace"

      - name: Live Slurm happy lane (real srun, real slurmctld, two real slurmd)
        run: |
          node scripts/qa/runtime-v090-live-slurm.mjs \
            --lab isolated \
            --modes "${{ github.event.inputs.modes || 'tcp,relay' }}" \
            --runtime docker \
            --out .omo/evidence/vis-v090/task-46/slurm.json

      - name: Live Slurm failure lane (laptop/relay/compute/manager kill, expire/requeue, store fail, borrowed stop, saturated step, changed key)
        run: |
          node scripts/qa/runtime-v090-live-slurm.mjs \
            --lab isolated \
            --modes "${{ github.event.inputs.modes || 'tcp,relay' }}" \
            --case failure \
            --runtime docker \
            --out .omo/evidence/vis-v090/task-46/slurm-failure.json

      # The lab discards its own container on success; this covers a lane that died
      # mid-lab, so the runner never carries a stale privileged container forward.
      - name: Discard the lab container
        if: always()
        shell: bash
        run: docker rm -f vis-v090-slurm-lab >/dev/null 2>&1 || true

      - name: Upload live Slurm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-v090-live-slurm
          path: .omo/evidence/vis-v090/task-46/
          retention-days: 30
          if-no-files-found: error

  live-ssh:
    name: Live SSH (real sshd host key / jump host / reconnection)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same privileged-initialisation contract as the Slurm lane: the lab's real
      # /etc/hosts edit, package install, network namespaces and daemons run inside
      # a --privileged ubuntu:24.04 container, never as the unprivileged runner
      # user, and the container capability is proven before either lane starts.
      - name: Verify the isolated runner can host the privileged lab container
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'docker daemon reachable: {{.ServerVersion}}'
          docker run --rm --privileged ubuntu:24.04 ip netns add vislab-preflight
          echo "privileged container created a real network namespace"

      - name: Live SSH happy lane
        run: |
          node scripts/qa/runtime-v090-live-ssh.mjs \
            --isolated \
            --runtime docker \
            --out .omo/evidence/vis-v090/task-46/ssh.json

      - name: Live SSH failure lane
        run: |
          node scripts/qa/runtime-v090-live-ssh.mjs \
            --isolated \
            --case failure \
            --runtime docker \
            --out .omo/evidence/vis-v090/task-46/ssh-failure.json

      - name: Discard the lab container
        if: always()
        shell: bash
        run: docker rm -f vis-v090-slurm-lab >/dev/null 2>&1 || true

      - name: Upload live SSH evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-v090-live-ssh
          path: .omo/evidence/vis-v090/task-46/
          retention-days: 30
          if-no-files-found: error

  # The packaged Bridge / Electron artifacts are NOT consumed here: an artifact
  # download that does not name its producing run only sees the current run's
  # artifacts and finds none (that is exactly how all four platforms used to stop
  # at "Locate the packaged Bridge"). Production and consumption therefore sit in
  # the SAME run's dependency chain: build-electron.yml's `packaged-bridge-qa`
  # job runs with `needs: [bridge-installers]`, downloads the artifact that job
  # uploaded in the same run, and is gated by that workflow's `complete-ci`.

  live-qa-complete:
    name: Live QA complete
    runs-on: ubuntu-latest
    needs: [live-slurm, live-ssh]
    if: always()
    steps:
      - name: Require every live lane to have succeeded
        shell: bash
        env:
          SLURM: ${{ needs.live-slurm.result }}
          SSH: ${{ needs.live-ssh.result }}
        run: |
          failed=0
          for lane in "live-slurm:$SLURM" "live-ssh:$SSH"; do
            name="${lane%%:*}"; result="${lane##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed ($result)"
              failed=1
            fi
          done
          exit "$failed"
