name: Complete CI and Release

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build web app
        run: pnpm build

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm build && pnpm exec electron-builder --publish never

      - name: Upload VIS installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}-artifacts
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/*.yml
          retention-days: 7
          if-no-files-found: error

  bridge-installers:
    name: Bridge installer (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            msvc_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            msvc_arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            msvc_arch: x64
          - runner: macos-latest
            platform: macos
            arch: arm64
            msvc_arch: arm64
          - runner: windows-2022
            platform: windows
            arch: x64
            msvc_arch: x64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress --yes

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vis_bridge binary payload
        run: pnpm bridge:build

      - name: Package native vis_bridge installer
        run: pnpm bridge:package-installer

      - name: Exercise Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          installer=(dist-bridge/installers/*.deb)
          sudo dpkg -i "${installer[0]}"
          test "$(command -v vis_bridge)" = '/usr/bin/vis_bridge'
          vis_bridge --help
          export VIS_BRIDGE_STATE_DIR="$RUNNER_TEMP/vis-bridge-state"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          sudo dpkg -i "${installer[0]}"
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"
          sudo dpkg -r vis-bridge
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"

      - name: Exercise macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package=(dist-bridge/installers/*.pkg)
          sudo installer -pkg "${package[0]}" -target /
          test "$(command -v vis_bridge)" = '/usr/local/bin/vis_bridge'
          vis_bridge --help
          export VIS_BRIDGE_STATE_DIR="$RUNNER_TEMP/vis-bridge-state"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          sudo installer -pkg "${package[0]}" -target /
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"
          vis_bridge stop
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"
          sudo rm /usr/local/bin/vis_bridge

      - name: Exercise Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist-bridge/installers/*.exe' | Select-Object -First 1
          $firstInstall = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($firstInstall.ExitCode -ne 0) { throw "Installer exited with $($firstInstall.ExitCode)" }
          $secondInstall = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($secondInstall.ExitCode -ne 0) { throw "Reinstall exited with $($secondInstall.ExitCode)" }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs/vis_bridge'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $pathMatches = @($userPath -split ';' | Where-Object { $_ -eq $installDirectory })
          if ($pathMatches.Count -ne 1) { throw "Installer added PATH entry $($pathMatches.Count) times" }
          $env:Path = "$env:Path;$userPath"
          vis_bridge --help
          $env:VIS_BRIDGE_STATE_DIR = Join-Path $env:RUNNER_TEMP 'vis-bridge-state'
          vis_bridge start --port 23199
          $lifecycleEvidence = Join-Path $env:RUNNER_TEMP 'bridge-lifecycle.json'
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn $env:VIS_BRIDGE_STATE_DIR 23199 $lifecycleEvidence
          $customStateDirectory = $env:VIS_BRIDGE_STATE_DIR
          Remove-Item Env:VIS_BRIDGE_STATE_DIR
          $secondInstall = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($secondInstall.ExitCode -ne 0) { throw "Daemon reinstall exited with $($secondInstall.ExitCode)" }
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped $customStateDirectory 23199 $lifecycleEvidence
          $env:VIS_BRIDGE_STATE_DIR = $customStateDirectory
          vis_bridge start --port 23199
          $uninstallEvidence = Join-Path $env:RUNNER_TEMP 'bridge-uninstall-lifecycle.json'
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn $env:VIS_BRIDGE_STATE_DIR 23199 $uninstallEvidence
          $uninstaller = Join-Path $installDirectory 'Uninstall.exe'
          Remove-Item Env:VIS_BRIDGE_STATE_DIR
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped $customStateDirectory 23199 $uninstallEvidence

      - name: Upload vis_bridge installer
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}-${{ matrix.arch }}-artifacts
          path: |
            dist-bridge/installers/*.deb
            dist-bridge/installers/*.pkg
            dist-bridge/installers/*.exe
          retention-days: 7
          if-no-files-found: error

  complete-ci:
    name: Complete CI
    if: always()
    needs: [validate, build, bridge-installers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BRIDGE_INSTALLERS_RESULT: ${{ needs.bridge-installers.result }}
        run: |
          if [ "$VALIDATE_RESULT" != 'success' ] || [ "$BUILD_RESULT" != 'success' ] || [ "$BRIDGE_INSTALLERS_RESULT" != 'success' ]; then
            exit 1
          fi

  release:
    name: Publish draft release
    needs: [build, bridge-installers, complete-ci]
    if: startsWith(github.ref, 'refs/tags/v') && needs.complete-ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-artifacts'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Vis ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
