name: Complete CI and Release

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build web app
        run: pnpm build

  # Electron native lanes: one job per platform/arch pair (macOS x64/arm64,
  # Windows x64/arm64, Linux x64). Each lane passes explicit platform/arch
  # flags to electron-builder (no fat/universal builds), runs the unpacked-app
  # qa:electron smoke BEFORE uploading, exercises the lane's own installers,
  # and uploads only arch-scoped artifacts. macOS is unsigned but ad-hoc:
  # electron-builder.yml pins mac.identity "-" and mac.notarize false, and the
  # unix installer QA runs codesign --verify --deep --strict plus an adhoc/no-
  # TeamIdentifier check — no signing credentials live anywhere in CI.

  build-macos-x64:
    name: Electron mac x64
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner architecture
        run: test "$(node -p process.arch)" = "x64"

      - name: Build Electron app for x64
        run: pnpm build && pnpm exec electron-builder --publish never --mac --x64

      - name: Smoke unpacked app
        env:
          VIS_SMOKE_OUT_DIR: ${{ runner.temp }}/smoke-unpacked
        shell: bash
        run: |
          UNPACKED_DIR="$(find dist-electron -maxdepth 1 -type d -name '*-unpacked' -print -quit)"
          test -n "$UNPACKED_DIR"
          VIS_ELECTRON_EXECUTABLE="$UNPACKED_DIR/Vis.app/Contents/MacOS/Vis" node scripts/qa/electron-smoke.mjs
          node -e "const r = require(process.env.VIS_SMOKE_OUT_DIR + '/receipt.json'); if (r.platform.platform !== 'darwin' || r.platform.arch !== 'x64') process.exit(1)"

      - name: Exercise installer (DMG and ZIP)
        shell: bash
        run: bash scripts/qa/electron-installer-unix.sh --platform macos --arch x64 --artifacts-dir dist-electron --smoke-out-dir "$RUNNER_TEMP/smoke-installer"

      - name: Verify node-pty in Electron runtime (VIS_PTY_OK)
        shell: bash
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          pnpm exec electron --version
          ELECTRON_BIN="$(node -e "process.stdout.write(require('electron'))")"
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes electron \
            --electron-executable "$ELECTRON_BIN" \
            --out-dir "$VIS_PTY_OUT_DIR"

      - name: Upload VIS installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-x64-artifacts
          path: |
            dist-electron/Vis-*-x64-MacOS.dmg
            dist-electron/Vis-*-x64-MacOS.zip
          retention-days: 7
          if-no-files-found: error

  build-macos-arm64:
    name: Electron mac arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner architecture
        run: test "$(node -p process.arch)" = "arm64"

      - name: Build Electron app for arm64
        run: pnpm build && pnpm exec electron-builder --publish never --mac --arm64

      - name: Smoke unpacked app
        env:
          VIS_SMOKE_OUT_DIR: ${{ runner.temp }}/smoke-unpacked
        shell: bash
        run: |
          UNPACKED_DIR="$(find dist-electron -maxdepth 1 -type d -name '*-unpacked' -print -quit)"
          test -n "$UNPACKED_DIR"
          VIS_ELECTRON_EXECUTABLE="$UNPACKED_DIR/Vis.app/Contents/MacOS/Vis" node scripts/qa/electron-smoke.mjs
          node -e "const r = require(process.env.VIS_SMOKE_OUT_DIR + '/receipt.json'); if (r.platform.platform !== 'darwin' || r.platform.arch !== 'arm64') process.exit(1)"

      - name: Exercise installer (DMG and ZIP)
        shell: bash
        run: bash scripts/qa/electron-installer-unix.sh --platform macos --arch arm64 --artifacts-dir dist-electron --smoke-out-dir "$RUNNER_TEMP/smoke-installer"

      - name: Verify node-pty in Electron runtime (VIS_PTY_OK)
        shell: bash
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          pnpm exec electron --version
          ELECTRON_BIN="$(node -e "process.stdout.write(require('electron'))")"
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes electron \
            --electron-executable "$ELECTRON_BIN" \
            --out-dir "$VIS_PTY_OUT_DIR"

      - name: Upload VIS installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-arm64-artifacts
          path: |
            dist-electron/Vis-*-arm64-MacOS.dmg
            dist-electron/Vis-*-arm64-MacOS.zip
          retention-days: 7
          if-no-files-found: error

  build-windows-x64:
    name: Electron win x64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner architecture
        run: node -e "if (process.arch !== 'x64') process.exit(1)"

      - name: Build Electron app for x64
        run: pnpm build && pnpm exec electron-builder --publish never --win --x64

      - name: Smoke unpacked app
        env:
          VIS_SMOKE_OUT_DIR: ${{ runner.temp }}/smoke-unpacked
        shell: pwsh
        run: |
          $unpackedDir = Get-ChildItem dist-electron -Directory -Filter '*-unpacked' | Select-Object -First 1
          if (-not $unpackedDir) { throw 'no unpacked app dir' }
          $exe = Get-ChildItem $unpackedDir.FullName -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'no unpacked exe' }
          $env:VIS_ELECTRON_EXECUTABLE = $exe.FullName
          node scripts/qa/electron-smoke.mjs
          node -e "const r = require(process.env.VIS_SMOKE_OUT_DIR + '/receipt.json'); if (r.platform.platform !== 'win32' || r.platform.arch !== 'x64') process.exit(1)"

      - name: Exercise installer
        shell: pwsh
        run: ./scripts/qa/electron-installer-windows.ps1 -Arch x64

      - name: Verify node-pty in Electron runtime (VIS_PTY_OK)
        shell: pwsh
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          pnpm exec electron --version
          $electronBin = node -e "process.stdout.write(require('electron'))"
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes electron --electron-executable $electronBin --out-dir $env:VIS_PTY_OUT_DIR

      - name: Upload VIS installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-x64-artifacts
          path: |
            dist-electron/Vis-*-x64-Windows.exe
          retention-days: 7
          if-no-files-found: error

  build-windows-arm64:
    name: Electron win arm64
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner architecture
        run: node -e "if (process.arch !== 'arm64') process.exit(1)"

      - name: Build Electron app for arm64
        run: pnpm build && pnpm exec electron-builder --publish never --win --arm64

      - name: Smoke unpacked app
        env:
          VIS_SMOKE_OUT_DIR: ${{ runner.temp }}/smoke-unpacked
        shell: pwsh
        run: |
          $unpackedDir = Get-ChildItem dist-electron -Directory -Filter '*-unpacked' | Select-Object -First 1
          if (-not $unpackedDir) { throw 'no unpacked app dir' }
          $exe = Get-ChildItem $unpackedDir.FullName -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'no unpacked exe' }
          $env:VIS_ELECTRON_EXECUTABLE = $exe.FullName
          node scripts/qa/electron-smoke.mjs
          node -e "const r = require(process.env.VIS_SMOKE_OUT_DIR + '/receipt.json'); if (r.platform.platform !== 'win32' || r.platform.arch !== 'arm64') process.exit(1)"

      - name: Exercise installer
        shell: pwsh
        run: ./scripts/qa/electron-installer-windows.ps1 -Arch arm64

      - name: Verify node-pty in Electron runtime (VIS_PTY_OK)
        shell: pwsh
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          pnpm exec electron --version
          $electronBin = node -e "process.stdout.write(require('electron'))"
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes electron --electron-executable $electronBin --out-dir $env:VIS_PTY_OUT_DIR

      - name: Upload VIS installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-arm64-artifacts
          path: |
            dist-electron/Vis-*-arm64-Windows.exe
          retention-days: 7
          if-no-files-found: error

  build-linux-x64:
    name: Electron linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner architecture
        run: test "$(node -p process.arch)" = "x64"

      - name: Build Electron app for x64
        run: pnpm build && pnpm exec electron-builder --publish never --linux --x64

      - name: Smoke unpacked app
        env:
          VIS_SMOKE_OUT_DIR: ${{ runner.temp }}/smoke-unpacked
        shell: bash
        run: |
          UNPACKED_DIR="$(find dist-electron -maxdepth 1 -type d -name '*-unpacked' -print -quit)"
          test -n "$UNPACKED_DIR"
          xvfb-run -a env VIS_ELECTRON_EXECUTABLE="$UNPACKED_DIR/vis" node scripts/qa/electron-smoke.mjs
          node -e "const r = require(process.env.VIS_SMOKE_OUT_DIR + '/receipt.json'); if (r.platform.platform !== 'linux' || r.platform.arch !== 'x64') process.exit(1)"

      - name: Exercise installer (deb and AppImage)
        shell: bash
        run: bash scripts/qa/electron-installer-unix.sh --platform linux --arch x64 --artifacts-dir dist-electron --smoke-out-dir "$RUNNER_TEMP/smoke-installer"

      - name: Verify node-pty in Electron runtime (VIS_PTY_OK)
        shell: bash
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          pnpm exec electron --version
          ELECTRON_BIN="$(node -e "process.stdout.write(require('electron'))")"
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes electron \
            --electron-executable "$ELECTRON_BIN" \
            --out-dir "$VIS_PTY_OUT_DIR"

      - name: Upload VIS installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-x64-artifacts
          path: |
            dist-electron/Vis-*-x86_64-Linux.AppImage
            dist-electron/Vis-*-amd64-Linux.deb
          retention-days: 7
          if-no-files-found: error

  bridge-installers:
    name: Bridge installer (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            msvc_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            msvc_arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            msvc_arch: x64
          - runner: macos-latest
            platform: macos
            arch: arm64
            msvc_arch: arm64
          - runner: windows-2022
            platform: windows
            arch: x64
            msvc_arch: x64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress --yes

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows process-tree cleanup
        if: runner.os == 'Windows'
        run: pnpm vitest run processTree.windows.test.ts acpTerminalManager.test.ts

      - name: Build vis_bridge binary payload
        run: pnpm bridge:build

      - name: Package native vis_bridge installer
        run: pnpm bridge:package-installer

      - name: Exercise Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          installer=(dist-bridge/installers/*.deb)
          sudo dpkg -i "${installer[0]}"
          test "$(command -v vis_bridge)" = '/usr/bin/vis_bridge'
          vis_bridge --help
          export VIS_BRIDGE_STATE_DIR="$RUNNER_TEMP/vis-bridge-state"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-pty "$VIS_BRIDGE_STATE_DIR" 23199 unused
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          sudo dpkg -i "${installer[0]}"
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"
          sudo dpkg -r vis-bridge
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"

      - name: Verify node-pty across runtimes (VIS_PTY_OK)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes node,sea \
            --bridge-binary "$(command -v vis_bridge)" \
            --state-dir "$RUNNER_TEMP/pty-dual-runtime-state" \
            --port 23201 --out-dir "$VIS_PTY_OUT_DIR"

      - name: Exercise macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package=(dist-bridge/installers/*.pkg)
          sudo installer -pkg "${package[0]}" -target /
          test "$(command -v vis_bridge)" = '/usr/local/bin/vis_bridge'
          vis_bridge --help
          export VIS_BRIDGE_STATE_DIR="$RUNNER_TEMP/vis-bridge-state"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-pty "$VIS_BRIDGE_STATE_DIR" 23199 unused
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          sudo installer -pkg "${package[0]}" -target /
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-lifecycle.json"
          vis_bridge start --port 23199
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs spawn "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"
          vis_bridge stop
          node scripts/qa/vis-bridge-installer-daemon-qa.mjs assert-stopped "$VIS_BRIDGE_STATE_DIR" 23199 "$RUNNER_TEMP/bridge-remove-lifecycle.json"
          sudo rm /usr/local/bin/vis_bridge

      - name: Verify node-pty across runtimes (VIS_PTY_OK)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes node,sea \
            --bridge-binary "$(command -v vis_bridge)" \
            --state-dir "$RUNNER_TEMP/pty-dual-runtime-state" \
            --port 23201 --out-dir "$VIS_PTY_OUT_DIR"

      - name: Exercise Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/qa/vis-bridge-installer-windows.ps1

      - name: Verify node-pty across runtimes (VIS_PTY_OK)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VIS_PTY_OUT_DIR: ${{ runner.temp }}/pty-dual-runtime
        run: |
          node scripts/qa/node-pty-dual-runtime.mjs --runtimes node,sea `
            --bridge-binary "$(Get-Command vis_bridge).Source" `
            --state-dir (Join-Path $env:RUNNER_TEMP 'pty-dual-runtime-state') `
            --port 23201 --out-dir $env:VIS_PTY_OUT_DIR

      - name: Upload vis_bridge installer
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}-${{ matrix.arch }}-artifacts
          path: |
            dist-bridge/installers/*.deb
            dist-bridge/installers/*.pkg
            dist-bridge/installers/*.exe
          retention-days: 7
          if-no-files-found: error

  complete-ci:
    name: Complete CI
    if: always()
    needs: [validate, build-macos-x64, build-macos-arm64, build-windows-x64, build-windows-arm64, build-linux-x64, bridge-installers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job and lane to pass
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LANE_BUILD_MACOS_X64: ${{ needs.build-macos-x64.result }}
          LANE_BUILD_MACOS_ARM64: ${{ needs.build-macos-arm64.result }}
          LANE_BUILD_WINDOWS_X64: ${{ needs.build-windows-x64.result }}
          LANE_BUILD_WINDOWS_ARM64: ${{ needs.build-windows-arm64.result }}
          LANE_BUILD_LINUX_X64: ${{ needs.build-linux-x64.result }}
          BRIDGE_INSTALLERS_RESULT: ${{ needs.bridge-installers.result }}
        run: |
          for result in \
            "$VALIDATE_RESULT" \
            "$LANE_BUILD_MACOS_X64" "$LANE_BUILD_MACOS_ARM64" \
            "$LANE_BUILD_WINDOWS_X64" "$LANE_BUILD_WINDOWS_ARM64" \
            "$LANE_BUILD_LINUX_X64" \
            "$BRIDGE_INSTALLERS_RESULT"; do
            if [ "$result" != 'success' ]; then
              echo "job result '$result' is not success"
              exit 1
            fi
          done

  release:
    name: Publish draft release
    needs: [build-macos-x64, build-macos-arm64, build-windows-x64, build-windows-arm64, build-linux-x64, bridge-installers, complete-ci]
    if: startsWith(github.ref, 'refs/tags/v') && needs.complete-ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-artifacts'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Vis ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
